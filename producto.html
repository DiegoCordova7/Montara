<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Montara - X</title>
        <link rel="stylesheet" href="assets/css/base.css">
        <link rel="stylesheet" href="assets/css/components/navbar.css">
        <link rel="stylesheet" href="assets/css/components/search.css">
        <link rel="stylesheet" href="assets/css/components/buttons.css">
        <link rel="stylesheet" href="assets/css/pages/producto.css">
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>
    <body>
        <div id="navbar-container"></div>
        <main class="product-container">
            <div class="product-main-grid">
                <div class="product-gallery">
                    <div class="main-image-box">
                        <img id="active-product-img" src
                            alt="Imagen del producto">
                    </div>
                </div>
                <div class="product-details">
                    <h1 class="product-title"
                        id="product-title">Cargando...</h1>
                    <div class="product-price" id="product-price">$0</div>
                    <div class="option-group">
                        <span class="option-label">Color: <strong
                                id="selected-color-name">-</strong></span>
                        <div class="color-options"
                            id="color-options-container"></div>
                    </div>
                    <div class="option-group">
                        <span class="option-label">Talla: <strong
                                id="selected-size-name">-</strong></span>
                        <div class="size-options"
                            id="size-options-container"></div>
                    </div>
                    <div class="specs-section" id="specs-container">
                        <h2>Detalles de producto</h2>
                    </div>
                    <div class="action-buttons">
                        <button class="btn btn-cart" id="btn-add-cart">Agregar
                            al carrito</button>
                        <button class="btn btn-buy" id="btn-buy-now">Comprar
                            ahora</button>
                    </div>
                </div>
            </div>
            <section class="comparator-section"
                id="comparator-container"></section>
        </main>
        <script type="module">
        import { cargarNavbar } from "./assets/js/components/navbar.js";
        cargarNavbar();
    </script>
        <script type="module" src="./assets/js/pages/producto.js"></script>
    </body>
</html>
